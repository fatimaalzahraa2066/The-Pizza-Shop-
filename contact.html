<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The pizza Shop</title>
  <!-- Style -->
  <link rel="stylesheet" href="style.css">
  <!-- Fontawesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- favicon -->
  <link rel="shortcut icon" href="./imgs/favicon.png" type="image/png">
</head>
<body>
  <!-- Header Start -->
  <header class="header">
    <nav class="navbar">
      <a href="index.html"><img src="./imgs/logo.jpg" alt="The pizza cove logo" class="logo"></a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="testimonials.html">Testimonials</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <!-- Header End -->
  <!-- Contact Start -->
  <section class="contact">
    <div class="container">
      <h2 class="title">Contact Us</h2>
      <div class="contact-content">
        
        <div class="contact-info">
          <div class="info-item">
            <i class="fas fa-location-dot"></i>
            <p>123 Pizza Street, Cario , Egypt </p>
          </div>
          <div class="info-item">
            <i class="fas fa-phone"></i>
            <p>+2123456789</p>
          </div>
          <div class="info-item">
            <i class="fas fa-envelope"></i>
            <p>info@pizza shop.com</p>
          </div>
        </div>
        <form class="contact-form">
          <input type="text" placeholder="Your Name" required>
          <input type="email" placeholder="Your Email" required>
          <textarea placeholder="Your Message" rows="5" required></textarea>
          <button type="submit" class="btn">Send Message </button>
        </form>
      </div>
    </div>
  </section>
  <!-- Contact End -->
    <!-- Footer Start -->
  <footer class="main-footer">
    <div class="container">
      <p> Created with by <span>Fatima Alzahraa Abdelbaki Ahmed </span> </p>
      <p>&copy;2026 The pizza Shop. All Rights Reserved.</p>
    </div>
  </footer>
  <!-- Footer End -->
</body>
</html>
